name: Guarded solo regression gate
on:
  push:
    branches:
      - integration/agy-haunted-p001-p003
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Safe-import regression
        run: bun run test:save
      - name: Engine, graph and local multiplayer regression
        run: bun run test:engine
      - name: Deterministic Last Midnight journey
        run: bun run test:midnight
      - name: Production build
        run: bun run build
